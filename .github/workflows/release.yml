name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (linux/arm64)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ github.ref_name }}"
          VERSION_CLEAN="${VERSION#v}"
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"

          SRC="target/${{ matrix.target }}/release/phi-plan"
          if [ "$GOOS" = "windows" ]; then
            SRC="${SRC}.exe"
          fi

          STAGE=".stage/${GOOS}-${GOARCH}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          if [ "$GOOS" = "windows" ]; then
            cp "$SRC" "$STAGE/phi-plan.exe"
          else
            cp "$SRC" "$STAGE/phi-plan"
          fi
          cp phi.yaml "$STAGE/phi.yaml"

          BASE="phi-plan_${VERSION_CLEAN}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            # Windows runners have no `zip` in Git Bash; use PowerShell instead.
            powershell -NoProfile -Command "Compress-Archive -Path '$STAGE/*' -DestinationPath '$BASE.zip' -Force"
          else
            tar czf "$BASE.tar.gz" -C "$STAGE" .
          fi
          echo "archive=${BASE}.*" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.package.outputs.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          VERSION_CLEAN="${VERSION#v}"
          cd artifacts
          find . -type f -name 'phi-plan_*' | sort | while read f; do
            name=$(basename "$f")
            hash=$(sha256sum "$f" | awk '{print $1}')
            echo "${hash}  ${name}"
          done > "checksums_${VERSION_CLEAN}.txt"
          cat "checksums_${VERSION_CLEAN}.txt"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
